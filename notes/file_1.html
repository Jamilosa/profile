    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"></path>
    </svg>
  </button>
  
  <button class="nav-btn nav-home" id="navHome" title="Go to home" aria-label="Navigate to home">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
  </button>
  
  <button class="nav-btn nav-forward" id="navForward" title="Go forward" aria-label="Navigate forward">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18l6-6-6-6"></path>
    </svg>
  </button>
</div>

<style>
:root {
  /* Navigation Button Colors */
  --nav-bg: #20242B;
  --nav-border: #424958;
  --nav-icon-color: #888888;
  --nav-icon-hover: #DCDDDE;
  --nav-shadow: 0 4px 12px rgba(0,0,0,0.3);
  --nav-glow: 0 0 10px rgba(97, 175, 239, 0.15);
  --nav-accent: #61AFEF;
  --nav-transition: all 0.2s ease-in-out;
}

.nav-buttons {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  z-index: 1000;
  background: rgba(32, 36, 43, 0.85);
  backdrop-filter: blur(8px);
  padding: 10px 14px;
  border-radius: 12px;
  box-shadow: var(--nav-shadow);
  border: 1px solid rgba(66, 73, 88, 0.6);
  animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
}

.nav-btn {
  width: 44px;
  height: 44px;
  border: 1px solid var(--nav-border);
  border-radius: 8px;
  background: var(--nav-bg);
  color: var(--nav-icon-color);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--nav-transition);
  padding: 0;
  font: inherit;
  flex-shrink: 0;
}

.nav-btn:hover:not(:disabled) {
  color: var(--nav-icon-hover);
  border-color: var(--nav-accent);
  transform: translateY(-3px);
  box-shadow: var(--nav-glow);
}

.nav-btn:active:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 0 8px rgba(97, 175, 239, 0.2);
}

.nav-btn:disabled {
  border-color: rgba(66, 73, 88, 0.3);
  color: rgba(136, 136, 136, 0.4);
  cursor: not-allowed;
  opacity: 0.5;
}

.nav-btn svg {
  width: 20px;
  height: 20px;
  stroke-width: 2;
}

/* Focus state for keyboard navigation */
.nav-btn:focus-visible {
  outline: none;
  border-color: var(--nav-accent);
  box-shadow: var(--nav-glow);
}

/* Responsive: Hide back/forward on mobile, keep home */
@media (max-width: 768px) {
  .nav-buttons {
    gap: 8px;
    padding: 8px 10px;
  }

  .nav-btn {
    width: 40px;
    height: 40px;
  }

  .nav-btn.nav-back,
  .nav-btn.nav-forward {
    display: none;
  }

  .nav-btn svg {
    width: 18px;
    height: 18px;
  }
}

/* Tablet: Reduce size slightly */
@media (max-width: 1024px) {
  .nav-buttons {
    bottom: 1.5rem;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const backBtn = document.getElementById('navBack');
  const homeBtn = document.getElementById('navHome');
  const forwardBtn = document.getElementById('navForward');
  
  if (!backBtn || !homeBtn || !forwardBtn) return;
  
  // Check if back is available
  function updateNavButtons() {
    backBtn.disabled = !window.history.length || window.history.length <= 1;
  }
  
  backBtn.addEventListener('click', () => window.history.back());
  forwardBtn.addEventListener('click', () => window.history.forward());
  homeBtn.addEventListener('click', () => window.location.href = 'index.html');
  
  updateNavButtons();
  
  // Update on navigation
  window.addEventListener('pageshow', updateNavButtons);
});
</script>

</body></html>
